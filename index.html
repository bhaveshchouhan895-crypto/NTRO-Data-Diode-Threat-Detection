<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTRO Unidirectional Threat Detector</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding: 24px;
        }
        header {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 5px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background-color: #131c31;
            border: 1px solid #1e293b;
            padding: 20px;
            border-radius: 8px;
        }
        .card-title {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
            color: #f8fafc;
        }
        .badge-secure {
            color: #34d399;
            font-size: 18px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: #131c31;
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            margin-bottom: 24px;
        }
        button {
            padding: 8px 18px;
            background-color: #0284c7;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #0369a1;
        }
        .table-container {
            background-color: #131c31;
            border: 1px solid #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
        }
        th {
            background-color: #1e293b;
            color: #94a3b8;
            font-weight: 600;
        }
        .tag-threat {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛡️ Unidirectional IP Traffic Threat Detector (NTRO)</h1>
        <div class="subtitle">Passive TAP Monitor | Strict Read-Only Mode (Zero Return Transmission)</div>
    </header>

    <div class="controls">
        <button id="toggleBtn" onclick="toggleMonitoring()">Pause Stream</button>
        <label>
            Speed: 
            <input type="range" id="speedRange" min="300" max="2000" value="800" step="100">
            <span id="speedVal">800ms</span>
        </label>
    </div>

    <div class="metrics-grid">
        <div class="card">
            <div class="card-title">Total Flows Ingested</div>
            <div class="card-value" id="totalFlows">0</div>
        </div>
        <div class="card">
            <div class="card-title">Threats Flagged</div>
            <div class="card-value" style="color: #f87171;" id="threatCount">0</div>
        </div>
        <div class="card">
            <div class="card-title">Hardware Diode State</div>
            <div class="card-value badge-secure">READ-ONLY (Secure)</div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Source IP</th>
                    <th>Target IP</th>
                    <th>Threat Classification</th>
                    <th>Confidence</th>
                    <th>Anomaly Signature</th>
                </tr>
            </thead>
            <tbody id="alertBody">
                <!-- Alerts will appear here dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        let totalFlows = 0;
        let threatCount = 0;
        let isRunning = true;
        let timer = null;

        const speedInput = document.getElementById("speedRange");
        const speedVal = document.getElementById("speedVal");

        speedInput.addEventListener("input", (e) => {
            speedVal.innerText = e.target.value + "ms";
            if (isRunning) restartTimer();
        });

        function toggleMonitoring() {
            isRunning = !isRunning;
            const btn = document.getElementById("toggleBtn");
            if (isRunning) {
                btn.innerText = "Pause Stream";
                btn.style.backgroundColor = "#0284c7";
                restartTimer();
            } else {
                btn.innerText = "Resume Stream";
                btn.style.backgroundColor = "#16a34a";
                clearInterval(timer);
            }
        }

        function restartTimer() {
            clearInterval(timer);
            timer = setInterval(processIncomingTraffic, parseInt(speedInput.value));
        }

        function processIncomingTraffic() {
            totalFlows++;
            document.getElementById("totalFlows").innerText = totalFlows;

            // Simulate Unidirectional Packet Metadata
            const types = ["normal", "normal", "scan", "c2", "ddos"];
            const choice = types[Math.floor(Math.random() * types.length)];
            const time = new Date().toLocaleTimeString();

            let threat = null;

            if (choice === "scan") {
                threat = {
                    src: "192.168.1.105",
                    dst: "10.0.0.1",
                    type: "Reconnaissance (Port Scan)",
                    conf: "94%",
                    desc: "Probed 45 target ports in <100ms"
                };
            } else if (choice === "c2") {
                threat = {
                    src: "10.0.0.42",
                    dst: "198.51.100.2",
                    type: "Botnet C2 Beaconing",
                    conf: "89%",
                    desc: "Fixed pulse interval detected (Jitter ~0.001s)"
                };
            } else if (choice === "ddos") {
                threat = {
                    src: "Multiple Spoofed IPs",
                    dst: "10.0.0.1",
                    type: "Volumetric DoS/DDoS",
                    conf: "98%",
                    desc: "Packet surge (>750 pkts/burst)"
                };
            }

            if (threat) {
                threatCount++;
                document.getElementById("threatCount").innerText = threatCount;

                const tbody = document.getElementById("alertBody");
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${time}</td>
                    <td><code>${threat.src}</code></td>
                    <td><code>${threat.dst}</code></td>
                    <td><span class="tag-threat">${threat.type}</span></td>
                    <td>${threat.conf}</td>
                    <td style="color: #94a3b8;">${threat.desc}</td>
                `;

                tbody.insertBefore(row, tbody.firstChild);

                // Keep only latest 10 rows
                if (tbody.children.length > 10) {
                    tbody.removeChild(tbody.lastChild);
                }
            }
        }

        restartTimer();
    </script>
</body>
</html>
